<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投标单位画像 - 招标风险监管与标段分析系统</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="./css/company-profile.css">
    <script>
        // 当前页面接口统一在此集中管理；useMock=true 时读取同目录 mock 数据联调。
        window.pageConfig = {
            useMock: true,
            getCompanyListData: '../api/companyProfile/list',
            getCompanyDetailData: '../api/companyProfile/detail'
        };
    </script>
</head>
<body>
    <div class="page-shell">
        <main class="main-area company-profile-page">
            <section class="profile-card company-profile-list-card">
                <div class="profile-toolbar">
                    <label class="profile-search">
                        <span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg></span>
                        <input id="companyKeyword" type="text" placeholder="搜索单位名称 / 法定代表人 / 股东...">
                    </label>
                    <button type="button" class="profile-search-reset is-hidden" id="companySearchReset" title="清除搜索">×</button>
                </div>
                <div class="profile-table-wrap">
                    <table class="profile-table">
                        <thead>
                            <tr>
                                <th>单位名称</th>
                                <th>法定代表人</th>
                                <th>注册资本</th>
                                <th>社会信用代码</th>
                                <th>成立日期</th>
                                <th>电话</th>
                                <th>邮箱</th>
                                <th>地址</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="companyListBody"></tbody>
                    </table>
                </div>
                <div id="companyListPagination"></div>
            </section>

        </main>
    </div>

    <!-- 企业档案弹窗：点击列表「查看」按钮后弹出，替代原页面下方档案区块。 -->
    <div class="modal-mask is-hidden" id="companyDetailModal" role="dialog" aria-modal="true" aria-labelledby="companyDetailModalTitle">
        <div class="modal-panel company-detail-modal-panel">
            <div class="modal-head">
                <div class="modal-title-area">
                    <div class="modal-title-line">
                        <h2 id="companyDetailModalTitle">企业档案</h2>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="icon-btn" id="companyDetailModalClose" title="关闭">
                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body" id="companyDetailArea"></div>
        </div>
    </div>

    <script type="text/html" id="company-row-temp">
        <tr>
            <td><div class="profile-company-name">{{name}}</div></td>
            <td class="profile-legal">{{legalPerson}}</td>
            <td>{{registeredCapital}}</td>
            <td class="code-cell">{{creditCode}}</td>
            <td>{{establishDate}}</td>
            <td>{{phone}}</td>
            <td>{{email}}</td>
            <td>{{address}}</td>
            <td class="profile-action"><button type="button" class="matrix-detail" data-view-profile="{{profileId}}" title="查看企业档案"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg></button></td>
        </tr>
    </script>

    <script type="text/html" id="company-empty-row-temp">
        <tr><td colspan="9" class="profile-empty">{{message}}</td></tr>
    </script>

    <script src="./js/mock/company-profile.mock.js"></script>
    <script src="./js/company-profile.js"></script>
</body>
</html>
